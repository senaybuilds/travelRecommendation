<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Travel Explorer</title>
    <link rel="stylesheet" href="travel_recommendation.css" />
  </head>
  <body>
    <nav>
      <h2>Travel Explorer</h2>

      <div class="nav-links">
        <a href="travel_recommendation.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
      </div>
    </nav>

    <main class="contact-page">
      <section class="contact-intro">
        <h1>Contact Us</h1>
        <p>
          Have a question or need help planning your next trip? Send us a
          message.
        </p>
      </section>

      <form id="contactForm">
        <label for="contactName">Name</label>
        <input type="text" id="contactName" name="name" required />

        <label for="contactEmail">Email</label>
        <input type="email" id="contactEmail" name="email" required />

        <label for="contactMessage">Message</label>
        <textarea
          id="contactMessage"
          name="message"
          rows="6"
          required
        ></textarea>

        <button type="submit">Submit</button>
      </form>
    </main>

    <script>
      document
        .getElementById("contactForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          alert("Thank you for contacting Travel Explorer!");
          this.reset();
        });
    </script>
  </body>
</html>
